# Compilazione automatica di WebcamLR (lavoro «d-coda-ci»).
# Quattro lavori indipendenti: linux (protocollo C# e Kotlin, token), macos (Mac e iPhone con XcodeGen, senza firma),
# windows (tutti i progetti .NET, compresa l'app WinUI) e android (APK di debug).
# Ogni passo scrive il proprio registro in registri/; se un lavoro fallisce i registri si scaricano come artifact.
# I passi di compilazione girano anche quando un passo precedente è fallito (if: !cancelled()),
# così un'esecuzione raccoglie tutti gli errori e non solo il primo.
name: Compila

on:
  push:
    branches: [ci, prestazioni, round-2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compila-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: linux (protocollo, ricevitore, token)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepara la cartella dei registri
        run: mkdir -p registri

      # Tutti i progetti di test .NET sono net8.0: girano anche su Linux (Effetti usa OnnxRuntime senza DirectML).
      - name: dotnet test (Protocollo, Ricevitore, Webcam.Logica, Setup.Logica, Effetti)
        if: ${{ !cancelled() }}
        run: |
          esito=0
          for progetto in Protocollo.Test Ricevitore.Test Webcam.Logica.Test Setup.Logica.Test Effetti.Test; do
            echo "::group::WebcamLR.$progetto"
            dotnet test "Windows/WebcamLR.$progetto" --nologo --logger "console;verbosity=normal" 2>&1 \
              | tee "registri/dotnet-test-$progetto.log" || esito=1
            echo "::endgroup::"
          done
          exit $esito

      - name: Protocollo Kotlin (gradle -PsoloProtocollo :protocollo:test)
        if: ${{ !cancelled() }}
        working-directory: Android
        run: ./gradlew --no-daemon -PsoloProtocollo :protocollo:test 2>&1 | tee ../registri/gradle-protocollo.log

      - name: Token grafici (genera_token.py --controlla)
        if: ${{ !cancelled() }}
        run: python3 Strumenti/genera_token.py --controlla 2>&1 | tee registri/token.log

      - name: Carica i registri
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registri-linux
          path: |
            registri/
            Android/protocollo/build/reports/
            Android/protocollo/build/test-results/
          if-no-files-found: ignore

  macos:
    name: macos (Mac e iPhone, senza firma)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Con l'Apple ID gratuito il team serve solo per firmare: qui non si firma.
      WEBCAMLR_TEAM: ""
    steps:
      - uses: actions/checkout@v4

      - name: Xcode più recente
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Strumenti (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen --version
          xcodebuild -version
          swift --version
          command -v xcbeautify || brew install xcbeautify
          mkdir -p registri

      - name: swift test (Protocollo)
        if: ${{ !cancelled() }}
        working-directory: Protocollo
        run: swift test 2>&1 | tee ../registri/swift-test-protocollo.log

      # Stile non ha test: si compila soltanto.
      - name: swift build (Stile)
        if: ${{ !cancelled() }}
        working-directory: Stile
        run: swift build 2>&1 | tee ../registri/swift-build-stile.log

      - name: Genera i progetti Xcode
        if: ${{ !cancelled() }}
        run: |
          (cd Mac && xcodegen generate --spec project-senza-account.yml)
          (cd iPhone && xcodegen generate)

      - name: Compila WebcamLR per Mac (project-senza-account.yml)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild -project Mac/WebcamLR-Mac.xcodeproj -scheme WebcamLR -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath build/Mac \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 \
            | tee registri/xcodebuild-mac.log | xcbeautify --renderer github-actions

      - name: Compila il microfono del Mac (driver e aiutante)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild -project Mac/WebcamLR-Mac.xcodeproj -scheme "WebcamLR Microfono" -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath build/Mac \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 \
            | tee registri/xcodebuild-mac-microfono.log | xcbeautify --renderer github-actions

      - name: Compila WebcamLR per iPhone (simulatore)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild -project iPhone/WebcamLR-iPhone.xcodeproj -scheme WebcamLR -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/iPhone \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 \
            | tee registri/xcodebuild-iphone.log | xcbeautify --renderer github-actions

      - name: Carica i registri
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registri-macos
          path: registri/
          if-no-files-found: ignore

  windows:
    name: windows (soluzione intera e test)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepara la cartella dei registri
        run: mkdir -p registri

      # Non c'è un .sln: l'app (WinUI 3) si porta dietro Protocollo, Ricevitore, Effetti, Microfono e Webcam.Logica,
      # e con il suo bersaglio anche Webcam, Webcam.Installa e il filtro DirectShow (anche x86).
      # Setup e i progetti di test si compilano a parte.
      - name: dotnet build (WebcamLR.App, x64)
        if: ${{ !cancelled() }}
        run: |
          dotnet build Windows/WebcamLR.App/WebcamLR.App.csproj -c Debug -p:Platform=x64 --nologo 2>&1 \
            | tee registri/dotnet-build-app.log

      - name: dotnet build (gli altri progetti)
        if: ${{ !cancelled() }}
        run: |
          esito=0
          for progetto in Setup Setup.Logica Webcam Webcam.Installa Webcam.DirectShow Webcam.Logica Microfono \
                          Protocollo.Test Ricevitore.Test Webcam.Logica.Test Setup.Logica.Test Effetti.Test; do
            echo "::group::WebcamLR.$progetto"
            dotnet build "Windows/WebcamLR.$progetto" -c Debug --nologo 2>&1 \
              | tee "registri/dotnet-build-$progetto.log" || esito=1
            echo "::endgroup::"
          done
          exit $esito

      - name: dotnet test
        if: ${{ !cancelled() }}
        run: |
          esito=0
          for progetto in Protocollo.Test Ricevitore.Test Webcam.Logica.Test Setup.Logica.Test Effetti.Test; do
            echo "::group::WebcamLR.$progetto"
            dotnet test "Windows/WebcamLR.$progetto" --nologo --logger "console;verbosity=normal" 2>&1 \
              | tee "registri/dotnet-test-$progetto.log" || esito=1
            echo "::endgroup::"
          done
          exit $esito

      - name: Carica i registri
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registri-windows
          path: registri/
          if-no-files-found: ignore

  android:
    name: android (APK di debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepara la cartella dei registri
        run: mkdir -p registri

      - name: assembleDebug
        if: ${{ !cancelled() }}
        working-directory: Android
        run: ./gradlew --no-daemon --continue :app:assembleDebug 2>&1 | tee ../registri/gradle-assemble.log

      - name: Test della logica (testDebugUnitTest)
        if: ${{ !cancelled() }}
        working-directory: Android
        run: ./gradlew --no-daemon --continue :app:testDebugUnitTest 2>&1 | tee ../registri/gradle-test.log

      # Lint: segnala, ma non blocca il lavoro.
      - name: Lint (lintDebug)
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: Android
        run: ./gradlew --no-daemon :app:lintDebug 2>&1 | tee ../registri/gradle-lint.log

      - name: Annotazioni degli errori Kotlin
        if: ${{ !cancelled() }}
        run: |
          grep -hE '^e: file://' registri/*.log | sort -u | head -50 | while IFS= read -r riga; do
            percorso=$(echo "$riga" | sed -E 's#^e: file://([^:]+):([0-9]+):([0-9]+) (.*)$#\1#')
            numero=$(echo "$riga" | sed -E 's#^e: file://([^:]+):([0-9]+):([0-9]+) (.*)$#\2#')
            messaggio=$(echo "$riga" | sed -E 's#^e: file://([^:]+):([0-9]+):([0-9]+) (.*)$#\4#')
            echo "::error file=${percorso#$GITHUB_WORKSPACE/},line=$numero::$messaggio"
          done || true

      - name: Carica i registri
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registri-android
          path: |
            registri/
            Android/app/build/reports/
          if-no-files-found: ignore
