# Base del progetto Xcode del ricevitore Mac: funziona anche con l'Apple ID gratuito.
# Non si usa da sola: la includono project.yml (completo) e project-senza-account.yml.
# Non modificare il .xcodeproj a mano: si rigenera con XcodeGen (vedi Strumenti/).
name: WebcamLR-Mac
options:
  bundleIdPrefix: it.lrapps.webcamlr
  deploymentTarget:
    macOS: "14.0"
  # Lingua di partenza italiano; traduzione inglese in Risorse/Localizable.xcstrings (P22).
  developmentLanguage: it
# Versione (MARKETING_VERSION) e numero di build (CURRENT_PROJECT_VERSION): da Strumenti/Versione.xcconfig,
# l'unica fonte per Mac e iPhone. Non scriverli qui: le impostazioni qui sotto vincerebbero.
configFiles:
  Debug: ../Strumenti/Versione.xcconfig
  Release: ../Strumenti/Versione.xcconfig
settings:
  base:
    # P22: i testi di SwiftUI e String(localized:) finiscono nel catalogo dei testi quando Xcode compila.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_TEAM: ${WEBCAMLR_TEAM}
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"
packages:
  WebcamLRProtocollo:
    path: ../Protocollo
  Stile:
    path: ../Stile
targets:
  WebcamLR:
    type: application
    platform: macOS
    scheme: {}
    # Risorse: l'icona dell'app (si rigenera con Strumenti/genera_icone.py), il catalogo dei testi
    # con l'inglese (Localizable.xcstrings) e i testi dell'Info.plist (en.lproj, it.lproj) (P22).
    # Microfono/App: la parte C del microfono del telefono (P20), vista da Swift con Ponte.h.
    sources: [Sorgenti, Risorse, Microfono/App]
    dependencies:
      - package: WebcamLRProtocollo
      - package: Stile
    info:
      path: Generati/Info-App.plist
      properties:
        CFBundleDisplayName: WebcamLR
        # Italiano lingua di partenza (P22): l'inglese quando è la lingua del Mac o quella scelta per WebcamLR.
        CFBundleDevelopmentRegion: en
        LSApplicationCategoryType: public.app-category.video
        # Tradotta in Risorse/en.lproj/InfoPlist.strings: se cambia qui, cambia anche lì (e in it.lproj).
        NSLocalNetworkUsageDescription: WebcamLR si fa trovare dai telefoni sulla stessa rete Wi-Fi.
        NSBonjourServices:
          - _webcamlr._tcp
    entitlements:
      path: Generati/WebcamLR.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.server: true
        com.apple.security.network.client: true
        # Foto dal computer in Immagini › WebcamLR (funzione 35).
        com.apple.security.assets.pictures.read-write: true
        # Registrazioni in Filmati › WebcamLR (funzione 35).
        com.apple.security.assets.movies.read-write: true
        # Cavo USB (1.8): il socket Unix di usbmuxd, il servizio di Apple che porta all'iPhone sul cavo
        # (/var/run è un collegamento a /private/var/run). Funziona anche con l'Apple ID gratuito.
        # Il Mac App Store non accetta questa eccezione del sandbox: decisione in sospeso,
        # per ora distribuzione dal sito (vedi Documenti/Piano aggiornamenti.md, 1.8).
        com.apple.security.temporary-exception.files.absolute-path.read-write:
          - /private/var/run/usbmuxd
        # Microfono del telefono (P20): il servizio Mach dell'aiutante (un LaunchDaemon) che dà all'app
        # la memoria condivisa letta dal driver audio. Funziona anche con l'Apple ID gratuito; come l'eccezione
        # qui sopra, il Mac App Store non la accetta (Documenti/Microfono Mac.md).
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - it.lrapps.webcamlr.microfono
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Microfono/App/Ponte.h
        PRODUCT_BUNDLE_IDENTIFIER: it.lrapps.webcamlr.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: WebcamLR

  # Microfono del telefono (P20): «WebcamLR (microfono)» in tutte le app del Mac.
  # Non fanno parte dell'app: li costruisce e li installa Strumenti/Installa microfono.command
  # (/Library/Audio/Plug-Ins/HAL e /Library/LaunchDaemons, serve la password di amministratore).
  # Vanno bene con l'Apple ID gratuito: niente estensione di sistema né gruppo d'app.
  # Firma locale («-»): per provarli su questo Mac basta; per distribuirli serve Developer ID (pkg notarizzato).

  # Il driver audio (Audio Server Plug-in), caricato da coreaudiod.
  MicrofonoDriver:
    type: bundle
    platform: macOS
    sources:
      - Microfono/Driver
      - Microfono/Comune
    dependencies:
      - sdk: CoreFoundation.framework
    info:
      path: Generati/Info-Microfono.plist
      properties:
        CFBundleName: WebcamLR Microfono
        CFBundleDisplayName: WebcamLR (microfono)
        # La fabbrica (funzione WebcamLRMicrofono_Crea in Microfono.c) e il tipo «Audio Server Plug-in»
        # (kAudioServerPlugInTypeUUID). L'UUID della fabbrica è nostro e non deve cambiare.
        CFPlugInFactories:
          B4E6D78B-4793-4DB3-8DE0-FF789D737303: WebcamLRMicrofono_Crea
        CFPlugInTypes:
          443ABAB8-E7B3-491A-B985-BEB9187030DB:
            - B4E6D78B-4793-4DB3-8DE0-FF789D737303
        # Senza questa riga il sandbox di coreaudiod non lascia cercare il servizio dell'aiutante.
        AudioServerPlugIn_MachServices:
          - it.lrapps.webcamlr.microfono
    settings:
      base:
        PRODUCT_NAME: WebcamLR Microfono
        PRODUCT_BUNDLE_IDENTIFIER: it.lrapps.webcamlr.mac.microfono
        WRAPPER_EXTENSION: driver
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES

  # L'aiutante: crea la memoria condivisa e la passa all'app e al driver (Microfono/Aiuto/main.c).
  MicrofonoAiuto:
    type: tool
    platform: macOS
    sources:
      - Microfono/Aiuto/main.c
      - Microfono/Comune
    settings:
      base:
        PRODUCT_NAME: webcamlr-microfono-aiuto
        PRODUCT_BUNDLE_IDENTIFIER: it.lrapps.webcamlr.mac.microfono.aiuto
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
schemes:
  # Lo usa Strumenti/Installa microfono.command. Separato dallo schema dell'app: se il microfono
  # non compila, WebcamLR si costruisce lo stesso.
  WebcamLR Microfono:
    build:
      targets:
        MicrofonoDriver: all
        MicrofonoAiuto: all
