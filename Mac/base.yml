# Base del progetto Xcode del ricevitore Mac: funziona anche con l'Apple ID gratuito.
# Non si usa da sola: la includono project.yml (completo) e project-senza-account.yml.
# Non modificare il .xcodeproj a mano: si rigenera con XcodeGen (vedi Strumenti/).
name: WebcamLR-Mac
options:
  bundleIdPrefix: it.lrapps.webcamlr
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: it
settings:
  base:
    DEVELOPMENT_TEAM: ${WEBCAMLR_TEAM}
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
packages:
  WebcamLRProtocollo:
    path: ../Protocollo
  Stile:
    path: ../Stile
targets:
  WebcamLR:
    type: application
    platform: macOS
    scheme: {}
    # Risorse: l'icona dell'app (si rigenera con Strumenti/genera_icone.py).
    sources: [Sorgenti, Risorse]
    dependencies:
      - package: WebcamLRProtocollo
      - package: Stile
    info:
      path: Generati/Info-App.plist
      properties:
        CFBundleDisplayName: WebcamLR
        LSApplicationCategoryType: public.app-category.video
        NSLocalNetworkUsageDescription: WebcamLR si fa trovare dai telefoni sulla stessa rete Wi-Fi.
        NSBonjourServices:
          - _webcamlr._tcp
    entitlements:
      path: Generati/WebcamLR.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.server: true
        com.apple.security.network.client: true
        # Foto dal computer in Immagini › WebcamLR (funzione 35).
        com.apple.security.assets.pictures.read-write: true
        # Registrazioni in Filmati › WebcamLR (funzione 35).
        com.apple.security.assets.movies.read-write: true
        # Cavo USB (1.8): il socket Unix di usbmuxd, il servizio di Apple che porta all'iPhone sul cavo
        # (/var/run è un collegamento a /private/var/run). Funziona anche con l'Apple ID gratuito.
        # Il Mac App Store non accetta questa eccezione del sandbox: decisione in sospeso,
        # per ora distribuzione dal sito (vedi Documenti/Piano aggiornamenti.md, 1.8).
        com.apple.security.temporary-exception.files.absolute-path.read-write:
          - /private/var/run/usbmuxd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.lrapps.webcamlr.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: WebcamLR
