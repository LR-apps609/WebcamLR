# Ricevitore Mac completo, per l'account sviluppatore Apple a pagamento:
# la base più la webcam virtuale (Camera Extension).
# XcodeGen unisce i file: i dizionari si fondono, le liste si allungano.
include:
  - base.yml
targets:
  WebcamLR:
    dependencies:
      # La webcam virtuale finisce in WebcamLR.app/Contents/Library/SystemExtensions.
      - target: FotocameraVirtuale
    info:
      properties:
        NSSystemExtensionUsageDescription: Serve per far vedere WebcamLR come una webcam nelle altre app.
        NSCameraUsageDescription: WebcamLR passa il video dell'iPhone alla propria webcam virtuale.
        # Lo spazio condiviso con la webcam virtuale, per sapere quando è «in onda».
        WebcamLRGruppo: "$(TeamIdentifierPrefix)it.lrapps.webcamlr.mac"
    entitlements:
      properties:
        com.apple.developer.system-extension.install: true
        # Per mettere le immagini nel flusso di ingresso della webcam virtuale.
        com.apple.security.device.camera: true
        com.apple.security.application-groups:
          - "$(TeamIdentifierPrefix)it.lrapps.webcamlr.mac"

  FotocameraVirtuale:
    type: system-extension
    platform: macOS
    sources: [FotocameraVirtuale]
    info:
      path: Generati/Info-FotocameraVirtuale.plist
      properties:
        CFBundleDisplayName: WebcamLR
        NSSystemExtensionUsageDescription: Serve per far vedere WebcamLR come una webcam nelle altre app.
        WebcamLRGruppo: "$(TeamIdentifierPrefix)it.lrapps.webcamlr.mac"
        CMIOExtension:
          CMIOExtensionMachServiceName: "$(TeamIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"
    entitlements:
      path: Generati/FotocameraVirtuale.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - "$(TeamIdentifierPrefix)it.lrapps.webcamlr.mac"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.lrapps.webcamlr.mac.fotocamera
        PRODUCT_NAME: it.lrapps.webcamlr.mac.fotocamera
