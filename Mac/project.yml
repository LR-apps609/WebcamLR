# Ricevitore Mac completo, per l'account sviluppatore Apple a pagamento:
# la base più la webcam virtuale (Camera Extension).
# XcodeGen unisce i file: i dizionari si fondono, le liste si allungano.
include:
  - base.yml
targets:
  WebcamLR:
    dependencies:
      # La webcam virtuale finisce in WebcamLR.app/Contents/Library/SystemExtensions.
      - target: FotocameraVirtuale
    info:
      properties:
        # Tradotte in Risorse/en.lproj/InfoPlist.strings (P22): se cambiano qui, cambiano anche lì (e in it.lproj).
        NSSystemExtensionUsageDescription: Serve per far vedere WebcamLR come una webcam nelle altre app.
        NSCameraUsageDescription: WebcamLR passa il video del telefono alla propria webcam virtuale.
    entitlements:
      properties:
        com.apple.developer.system-extension.install: true
        # Per mettere le immagini nel flusso di ingresso della webcam virtuale.
        com.apple.security.device.camera: true
        com.apple.security.application-groups:
          - "$(TeamIdentifierPrefix)it.lrapps.webcamlr.mac"

  # Bundle id = quello dell'app più «.fotocamera» (macOS lo richiede); il nome del prodotto è il bundle id,
  # come vuole OSSystemExtensionRequest. Il servizio Mach comincia con il gruppo d'app, che comincia con il Team ID:
  # TEAMID.it.lrapps.webcamlr.mac (gruppo) → TEAMID.it.lrapps.webcamlr.mac.fotocamera (servizio).
  FotocameraVirtuale:
    type: system-extension
    platform: macOS
    # Con il proprio catalogo dei testi (Localizable.xcstrings) per l'immagine di attesa (P22)
    # e il proprio manifesto della privacy (un bundle con un eseguibile: Documenti/Pubblicazione.md).
    sources:
      - FotocameraVirtuale
      - path: Privacy/FotocameraVirtuale/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      # Colori e caratteri dell'immagine di attesa.
      - package: Stile
    info:
      path: Generati/Info-FotocameraVirtuale.plist
      properties:
        CFBundleDisplayName: WebcamLR
        # Come per l'app (base.yml); il numero di build lo completa lo script qui sotto.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        # Tradotta in FotocameraVirtuale/en.lproj/InfoPlist.strings (P22).
        NSSystemExtensionUsageDescription: Serve per far vedere WebcamLR come una webcam nelle altre app.
        CMIOExtension:
          CMIOExtensionMachServiceName: "$(TeamIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)"
    entitlements:
      path: Generati/FotocameraVirtuale.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - "$(TeamIdentifierPrefix)it.lrapps.webcamlr.mac"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.lrapps.webcamlr.mac.fotocamera
        PRODUCT_NAME: it.lrapps.webcamlr.mac.fotocamera
        # Lo script qui sotto scrive nell'Info.plist già prodotto.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # macOS sostituisce l'estensione installata solo se il numero di build cambia: con lo stesso numero
    # resterebbe attiva la versione vecchia anche dopo «Costruisci e installa». Prima della firma,
    # quindi la firma resta valida. Variabili senza graffe: XcodeGen sostituisce ${…} già alla generazione.
    postBuildScripts:
      - name: Numero di build della webcam virtuale
        basedOnDependencyAnalysis: false
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CURRENT_PROJECT_VERSION.$(date +%s)" \
            "$TARGET_BUILD_DIR/$INFOPLIST_PATH" || echo "warning: numero di build della webcam virtuale non aggiornato"
