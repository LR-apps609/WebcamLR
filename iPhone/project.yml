# Progetto Xcode dell'app iPhone. Non modificare il .xcodeproj a mano:
# si rigenera da questo file con XcodeGen (vedi Strumenti/).
name: WebcamLR-iPhone
options:
  bundleIdPrefix: it.lrapps.webcamlr
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
# Versione (MARKETING_VERSION) e numero di build (CURRENT_PROJECT_VERSION): da Strumenti/Versione.xcconfig,
# l'unica fonte per Mac e iPhone. Non scriverli qui: le impostazioni qui sotto vincerebbero.
configFiles:
  Debug: ../Strumenti/Versione.xcconfig
  Release: ../Strumenti/Versione.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: ${WEBCAMLR_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # P22: testi in String Catalog (Risorse/Localizable.xcstrings). Il catalogo lo tiene allineato al codice
    # Strumenti/estrai_testi.py (voci «manual»): Xcode non lo riscrive a ogni build.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO
packages:
  WebcamLRProtocollo:
    path: ../Protocollo
  Stile:
    path: ../Stile
targets:
  WebcamLR:
    type: application
    platform: iOS
    # Risorse: l'icona dell'app (si rigenera con Strumenti/genera_icone.py), i testi in inglese
    # (Localizable.xcstrings, controllato da Strumenti/estrai_testi.py) e i permessi tradotti (*.lproj/InfoPlist.strings).
    # WebcamLR.storekit: il prodotto WebcamLR Pro per provare l'acquisto in Xcode senza App Store Connect
    # (schema qui sotto, storeKitConfiguration). Nel progetto per modificarlo, ma non nell'app.
    # Privacy/PrivacyInfo.xcprivacy: il manifesto della privacy (Documenti/Pubblicazione.md), tra le risorse dell'app.
    # Risorse/Sfondi: gli sfondi pronti (Strumenti/genera_sfondi.py), come cartella (riferimento blu): nell'app restano
    # in «Sfondi/<id>.jpg», cioè Bundle.main.url(forResource: id, withExtension: "jpg", subdirectory: "Sfondi").
    sources:
      - Sorgenti
      - path: Risorse
        excludes:
          - Sfondi
      - path: Risorse/Sfondi
        type: folder
        buildPhase: resources
      - path: WebcamLR.storekit
        buildPhase: none
      - path: Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: WebcamLRProtocollo
      - package: Stile
    info:
      path: Generati/Info.plist
      properties:
        CFBundleDisplayName: WebcamLR
        # XcodeGen scriverebbe 1.0 e 1: si leggono invece da Strumenti/Versione.xcconfig (configFiles).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # P22: il codice e il catalogo partono dall'italiano (developmentLanguage: it), ma per una lingua che
        # l'app non ha (francese, tedesco…) iOS ripiega sulla regione di sviluppo: deve essere l'inglese.
        # L'italiano resta scelto per chi ha l'italiano tra le lingue preferite (c'è it.lproj).
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [it, en]
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # In inglese in Risorse/en.lproj/InfoPlist.strings; se si cambiano qui, va cambiata anche it.lproj.
        NSCameraUsageDescription: WebcamLR usa la fotocamera per inviare il video al tuo computer.
        NSMicrophoneUsageDescription: WebcamLR usa il microfono per inviare l'audio al tuo computer.
        NSLocalNetworkUsageDescription: WebcamLR cerca il tuo Mac o PC sulla stessa rete Wi-Fi.
        NSBonjourServices:
          - _webcamlr._tcp
        # Effetti video di Apple: nessuna chiave NSCameraPortraitEffectEnabled, NSCameraStudioLightEnabled o
        # NSCameraReactionEffectsEnabled. Senza, iOS non applica Ritratto, Luce da studio e Reazioni a WebcamLR
        # (non è un'app VoIP): sfocatura e luce sono solo le nostre, mai due sfocature.
        # Esportazione e cifratura: l'app cifra solo i propri dati in viaggio verso il computer dell'utente
        # (AES-GCM, ECDH ed ECDSA P-256, HKDF e SHA-256) e lo fa solo con CryptoKit, la crittografia di iOS:
        # nessun algoritmo nostro né librerie di crittografia incluse. Per Apple è «cifratura limitata a quella del
        # sistema operativo», esente dai documenti di esportazione: si dichiara NO e App Store Connect non chiede più
        # il questionario a ogni build. Ragionamento e fonti in Documenti/Pubblicazione.md («Cifratura ed esportazione»).
        # Se un giorno entra un algoritmo o una libreria di crittografia non di Apple, questa riga va ripensata.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.lrapps.webcamlr.iphone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: WebcamLR
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  WebcamLR:
    build:
      targets:
        WebcamLR: all
    run:
      config: Debug
      # ▶ in Xcode installa l'app sull'iPhone ma non la apre: la apri tu quando vuoi
      # (Xcode resta in attesa e si aggancia appena tocchi l'icona).
      askForAppToLaunch: true
      # WebcamLR Pro in prova: con ▶ da Xcode gli acquisti usano WebcamLR.storekit (nessun addebito, nessun
      # App Store Connect). Rimborsi e cancellazioni da Debug › StoreKit › Manage Transactions.
      # In TestFlight e sull'App Store vale il prodotto vero (Documenti/Pubblicazione.md).
      storeKitConfiguration: WebcamLR.storekit
    archive:
      config: Release
