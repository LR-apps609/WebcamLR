# Progetto Xcode dell'app iPhone. Non modificare il .xcodeproj a mano:
# si rigenera da questo file con XcodeGen (vedi Strumenti/).
name: WebcamLR-iPhone
options:
  bundleIdPrefix: it.lrapps.webcamlr
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
settings:
  base:
    DEVELOPMENT_TEAM: ${WEBCAMLR_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    # P22: testi in String Catalog (Risorse/Localizable.xcstrings). Il catalogo lo tiene allineato al codice
    # Strumenti/estrai_testi.py (voci «manual»): Xcode non lo riscrive a ogni build.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO
packages:
  WebcamLRProtocollo:
    path: ../Protocollo
  Stile:
    path: ../Stile
targets:
  WebcamLR:
    type: application
    platform: iOS
    scheme: {}
    # Risorse: l'icona dell'app (si rigenera con Strumenti/genera_icone.py), i testi in inglese
    # (Localizable.xcstrings, controllato da Strumenti/estrai_testi.py) e i permessi tradotti (*.lproj/InfoPlist.strings).
    sources: [Sorgenti, Risorse]
    dependencies:
      - package: WebcamLRProtocollo
      - package: Stile
    info:
      path: Generati/Info.plist
      properties:
        CFBundleDisplayName: WebcamLR
        # P22: il codice e il catalogo partono dall'italiano (developmentLanguage: it), ma per una lingua che
        # l'app non ha (francese, tedesco…) iOS ripiega sulla regione di sviluppo: deve essere l'inglese.
        # L'italiano resta scelto per chi ha l'italiano tra le lingue preferite (c'è it.lproj).
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [it, en]
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # In inglese in Risorse/en.lproj/InfoPlist.strings; se si cambiano qui, va cambiata anche it.lproj.
        NSCameraUsageDescription: WebcamLR usa la fotocamera per inviare il video al tuo computer.
        NSMicrophoneUsageDescription: WebcamLR usa il microfono per inviare l'audio al tuo computer.
        NSLocalNetworkUsageDescription: WebcamLR cerca il tuo Mac o PC sulla stessa rete Wi-Fi.
        NSBonjourServices:
          - _webcamlr._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.lrapps.webcamlr.iphone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: WebcamLR
        TARGETED_DEVICE_FAMILY: "1"
